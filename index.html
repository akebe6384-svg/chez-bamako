<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chez-Bamako</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
      opacity: 0.9;
    }

    .container {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      margin-bottom: 25px;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 15px;
      font-size: 21px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    .category {
      background: white;
      padding: 20px 10px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      cursor: pointer;
    }

    .category span {
      display: block;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .welcome p {
      line-height: 1.6;
      color: #555;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Chez-Bamako</h1>
    <p>Découvrez ce qui se trouve autour de vous</p>
  </header>

  <main class="container">

    <input
      class="search"
      type="text"
      placeholder="🔎 Rechercher un commerce ou un service..."
    >

    <h2>Catégories</h2>

    <div class="categories">

      <div class="category">
        <span>🍔</span>
        Restaurants
      </div>

      <div class="category">
        <span>🛒</span>
        Boutiques
      </div>

      <div class="category">
        <span>💇</span>
        Beauté
      </div>

      <div class="category">
        <span>🔧</span>
        Services
      </div>

      <div class="category">
        <span>🏨</span>
        Hôtels
      </div>

      <div class="category">
        <span>🚗</span>
        Transport
      </div>

    </div>

    <div class="welcome">
      <h2>Bienvenue 👋</h2>
      <p>
        Chez-Bamako vous aide à découvrir des commerces,
        services et opportunités autour de vous.
      </p>
    </div>

  </main>

  <footer>
    © 2026 Chez-Bamako
  </footer>

</body>
  </html>
