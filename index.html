<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chez-Bamako</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

  <script>
document.getElementById("search").addEventListener("input", function() {
  const recherche = this.value.toLowerCase().trim();
  const categories = document.querySelectorAll(".category");

  categories.forEach(function(category) {
    const texte = category.innerText.toLowerCase();

    category.style.display =
      texte.includes(recherche) ? "block" : "none";
  });
});
</script>  
      

<body>

  <header>
    <h1>Chez-Bamako</h1>
    <p>Découvrez ce qui se trouve autour de vous</p>
  </header>

  <main class="container">

  <input
  id="search"
  class="search"
  type="text"
  placeholder="🔎 Rechercher un commerce ou un service..."
  onkeyup="rechercher()"
>
